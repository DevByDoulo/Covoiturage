# Réglages propres à votre poste. Copiez ce fichier en « application-local.yml »
# (même dossier) et adaptez-le : ce fichier-là n'est pas versionné.
covoitia:
  db:
    hote: localhost
    # Port de votre PostgreSQL 16 avec PostGIS (5432 par défaut, 5433 si deux versions sont installées).
    port: 5432

# Connexion Google : un ID client de développement est déjà fourni (application-dev.yml). Pour utiliser
# le vôtre, mettez le même ID ici ET dans frontend/src/environments/environment.ts :
#app:
#  google:
#    client-id: 1234567890-xxxx.apps.googleusercontent.com

# Envoi des codes de vérification par email. Sans cette section, les codes partent par « SMS »
# (simulés : écrits dans la console du backend).
# Gmail : activer la validation en deux étapes, puis créer un mot de passe d'application
# sur https://myaccount.google.com/apppasswords (16 lettres, à coller sans espaces).
#spring:
#  mail:
#    host: smtp.gmail.com
#    port: 587
#    username: votre.adresse@gmail.com
#    password: motdepassedapplication
#    properties:
#      mail.smtp.auth: true
#      mail.smtp.starttls.enable: true

# Paiement Wave (réel). Sans cette section, seules les espèces sont proposées.
# 1. Compte Wave Business (https://business.wave.com) > Développeurs : créer une clé API (droit « Checkout »)
#    et déclarer le webhook https://<adresse publique de l'API>/api/paiements/webhooks/wave
#    (événements checkout.session.completed et checkout.session.payment_failed) ; noter son secret.
# 2. Wave exige des adresses HTTPS : en local, exposer l'API et le site par un tunnel (ngrok, cloudflared),
#    et mettre ici l'adresse HTTPS du site Angular (Wave y renvoie le passager après paiement).
#app:
#  paiement:
#    url-retour: https://votre-tunnel-front.ngrok-free.app
#    wave:
#      api-key: wave_sn_prod_xxxxxxxx
#      secret-webhook: wave_sn_WHS_xxxxxxxx

# Paiement par PayDunya (Wave et Orange Money Sénégal, mode test sans argent réel).
# 1. Compte PayDunya Business > « Intégrez notre API » > « Configurer une nouvelle application » :
#    mode test, cocher Wave Sénégal et Orange Money Sénégal ; « Afficher les clés api ».
# 2. Recopier ci-dessous la clé principale, la clé privée DE TEST (test_private_...) et le jeton DE TEST.
#    La clé publique ne sert pas. Ne jamais commiter ce fichier ni partager ces clés.
# 3. url-retour peut rester en http://localhost:4200 en mode test ; url-api (adresse publique de l'API,
#    tunnel HTTPS vers le port 8080) est facultative : sans elle, le paiement est vérifié au retour du passager.
#app:
#  paiement:
#    url-retour: http://localhost:4200
#    url-api: https://votre-tunnel-api.ngrok-free.app
#    paydunya:
#      master-key: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      private-key: test_private_xxxxxxxxxxxxxxxxxxxxxxxxxxx
#      token: xxxxxxxxxxxxxxxxxxxx
#      mode: test
