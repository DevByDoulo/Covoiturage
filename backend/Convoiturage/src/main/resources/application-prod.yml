# Profil de production : toutes les valeurs sensibles viennent des variables d'environnement
# (COVOITIA_DB_URL, COVOITIA_DB_USERNAME, COVOITIA_DB_PASSWORD, COVOITIA_JWT_SECRET, CORS_ALLOWED_ORIGINS, GOOGLE_CLIENT_ID, ADMIN_*...).
server:
  error:
    include-message: never
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
