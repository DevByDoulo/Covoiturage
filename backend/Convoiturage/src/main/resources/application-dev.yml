# Profil de développement local : PostgreSQL du poste (application-local.yml), SMS et push affichés dans les logs.
# Ces valeurs ne doivent JAMAIS être utilisées en production.
spring:
  flyway:
    # Migrations nommées par date (V2026_10_25_1430__...) : deux développeurs peuvent fusionner dans le
    # désordre ; une migration plus ancienne arrivée après une plus récente est quand même appliquée.
    out-of-order: true

app:
  jwt:
    secret: ${COVOITIA_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNvdm9pdGlhLWNoYW5nZS1tZS1pbi1wcm9kLTIwMjY=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5000,http://localhost:8081}
  google:
    # ID client OAuth de développement, le même que frontend/src/environments/environment.ts.
    # Ce n'est pas un secret (il est visible dans le navigateur) ; origine autorisée : http://localhost:4200.
    client-id: ${GOOGLE_CLIENT_ID:520088419510-nu738k1cpi6s20k5fkqupu0nfbsgautv.apps.googleusercontent.com}
  ia:
    # Service ia-tarification lancé en local (uvicorn app.main:app --port 8000). Éteint : repli sur la formule.
    url: ${IA_TARIFICATION_URL:http://localhost:8000}
  admin:
    email: ${ADMIN_EMAIL:admin@covoitia.local}
    mot-de-passe: ${ADMIN_PASSWORD:Admin-Dev-2026!}
    telephone: ${ADMIN_TELEPHONE:+221700000000}

logging:
  level:
    sn.isep.Convoiturage: DEBUG
