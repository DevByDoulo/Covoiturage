spring:
  application:
    name: covoiturage
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # Réglages propres à chaque poste (port PostgreSQL...), non versionnés.
    # Copier application-local.example.yml en application-local.yml à la racine du backend.
    import: optional:file:./application-local.yml

  datasource:
    url: ${COVOITIA_DB_URL:jdbc:postgresql://${covoitia.db.hote:localhost}:${covoitia.db.port:5432}/covoiturage}
    username: ${COVOITIA_DB_USERNAME:covoiturage}
    password: ${COVOITIA_DB_PASSWORD:covoiturage}

  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré par Flyway (src/main/resources/db/migration) ; Hibernate se contente de le vérifier.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        serialization-mode: via_dto

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Ne pas interroger le serveur SMTP à chaque /actuator/health (10 s avec Gmail) : un envoi d'email
      # lent ne doit pas faire paraître l'application « en panne ».
      enabled: false

app:
  jwt:
    # Clé HMAC-SHA256 encodée en Base64 (32 octets minimum). Obligatoire hors profil dev.
    secret: ${COVOITIA_JWT_SECRET:}
    issuer: covoitia
    access-token-minutes: 30
    refresh-token-days: 30
  otp:
    longueur: 6
    validite-minutes: 5
    tentatives-max: 5
    delai-renvoi-secondes: 60
    # Codes envoyés à un même compte, pour un même usage : avec 5 essais par code, au plus 50 essais par jour
    # (1 chance sur 20 000 de deviner un code à 6 chiffres), et pas d'envoi massif de SMS.
    max-codes-par-heure: 5
    max-codes-par-jour: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  stockage:
    repertoire: ${STOCKAGE_REPERTOIRE:./uploads}
  google:
    # ID client OAuth Google (vérification des idToken du « Se connecter avec Google »)
    client-id: ${GOOGLE_CLIENT_ID:}
    # Clé Google Maps Platform (Routes API) pour les itinéraires. Vide => estimation à vol d'oiseau × 1,25.
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  firebase:
    # 06 Notifications : JSON du compte de service Firebase. Vide => les push sont seulement journalisés.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  ia:
    # Service ia-tarification (FastAPI, dossier ia-tarification/). Vide => prix calculés par la formule seule.
    url: ${IA_TARIFICATION_URL:}
    # Au-delà, le prix est calculé par la formule seule (la publication n'attend jamais l'IA).
    # Doit rester supérieur à l'attente de la météo côté service (1,5 s, ia-tarification/app/meteo.py).
    delai: ${IA_TARIFICATION_DELAI:2s}
  paiement:
    # Adresse HTTPS de l'application web : Wave y renvoie le passager après paiement (/reservations?paiement=...).
    url-retour: ${PAIEMENT_URL_RETOUR:}
    wave:
      # Wave Business (https://business.wave.com) : clé API et secret de signature du webhook.
      # Vides => Wave n'est pas proposé (paiement en espèces uniquement).
      api-key: ${WAVE_API_KEY:}
      secret-webhook: ${WAVE_SECRET_WEBHOOK:}
    orange-money:
      # Portail développeur Sonatel. L'intégration reste à écrire (OrangeMoneyFournisseur) : non proposé pour l'instant.
      client-id: ${ORANGE_MONEY_CLIENT_ID:}
      client-secret: ${ORANGE_MONEY_CLIENT_SECRET:}
      code-marchand: ${ORANGE_MONEY_CODE_MARCHAND:}
  admin:
    email: ${ADMIN_EMAIL:}
    mot-de-passe: ${ADMIN_PASSWORD:}
    telephone: ${ADMIN_TELEPHONE:}
